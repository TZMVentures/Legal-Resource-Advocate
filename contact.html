<!DOCTYPE html>
<html>
<head>
<title>Contact Us</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>Contact Us</h1>
</header>

<form
action="https://formspree.io/f/mzerkjlj"
method="POST">
<input
type="hidden"
name="_next"
value="">
    <input
    type="text"
    name="name"
    placeholder="Full Name"
    required>

    <input
    type="email"
    name="email"
    placeholder="Email Address"
    required>

    <input
    type="tel"
    name="phone"
    placeholder="Phone Number">

    <textarea
    name="message"
    placeholder="How may we assist you?"
    required></textarea>

    <button type="submit">
        Submit Inquiry
    </button>

</form>

</body>

</html>
